    <text x="48" y="86" font-family="Inter,Arial,sans-serif" font-size="16" fill="#8fa2aa">1280 × 720 source · 240 px browsing size · 160 px compact size</text>
    <text x="48" y="132" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#a65d3f" letter-spacing="1.5">SOURCE DISPLAYED AT 768 × 432</text>
    <image href="../episode-0004-thumbnail.png" x="48" y="152" width="768" height="432"/>
    <text x="880" y="132" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#a65d3f">240 × 135 · 18.75%</text>
    <image href="../episode-0004-thumbnail.png" x="880" y="152" width="240" height="135"/>
    <text x="1180" y="132" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#a65d3f">160 × 90 · 12.5%</text>
    <image href="../episode-0004-thumbnail.png" x="1180" y="152" width="160" height="90"/>
    <text x="880" y="352" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#a65d3f">VISUAL ORDER</text>
    <text x="880" y="388" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#f4f0e8">Headline → system → Companion → EP. 4</text>
    <text x="880" y="426" font-family="Inter,Arial,sans-serif" font-size="15" fill="#8fa2aa">Five qualities constrain the system; Trust and Observability carry emphasis.</text>
    <text x="48" y="650" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#a65d3f">SAFE AREA</text>
    <rect x="48" y="674" width="1200" height="86" rx="12" fill="#101d24" stroke="#36515e"/>
    <text x="76" y="709" font-family="Inter,Arial,sans-serif" font-size="16" fill="#f4f0e8">Brand, headline, Companion face, episode identifier and every characteristic label remain inside the safe inset.</text>
    <text x="76" y="737" font-family="Inter,Arial,sans-serif" font-size="14" fill="#8fa2aa">Headline remains the dominant readable element at 12.5%; labels are intentionally secondary.</text>
