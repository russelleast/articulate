[project]
name = "articulate-python-tooling"
version = "0.1.0"
description = "Shared Python tooling configuration for Articulate services"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "grpcio-tools>=1.76.0,<2",
  "httpx>=0.28.0,<1",
  "pyright>=1.1.400,<2",
  "pytest>=8.3.0,<9",
  "ruff>=0.11.0,<1",
]

[tool.pytest.ini_options]
testpaths = ["src/knowledge/api/tests", "src/tools/claim_simulator/tests", "src/knowledge/agents/review_proposed_claim/tests"]
pythonpath = ["src", "src/knowledge/shared", "src/knowledge/api", "src/tools/claim_simulator", "src/knowledge/agents/review_proposed_claim"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src/knowledge/api", "src/tools/claim_simulator", "src/knowledge/agents/review_proposed_claim"]
extraPaths = ["src", "src/knowledge/shared", "src/knowledge/agents/review_proposed_claim"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
